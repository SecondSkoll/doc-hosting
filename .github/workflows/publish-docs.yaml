name: Publish docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (defaults to the tag name on tag pushes, else "latest")'
        type: string
      language:
        description: 'Language to publish (defaults to "en")'
        type: string
      root_path:
        description: 'Root path to publish under (defaults to "docs")'
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build documentation (Sphinx dirhtml)
        run: uv run --group docs sphinx-build -b dirhtml docs docs/_build/dirhtml

      - name: Publish to the doc-hosting deployment
        env:
          API_URL: ${{ vars.DOC_HOSTING_API_URL }}
          # Two independent credentials: the deployment-wide publish token
          # (bearer header) and the docs project's shared secret (JSON
          # body). The first fully authenticated publication claims the
          # root path; later ones must match the secret. No S3 credentials
          # are needed: the API authorizes the uploads with short-lived
          # presigned URLs.
          API_TOKEN: ${{ secrets.DOC_HOSTING_API_TOKEN }}
          PROJECT_SECRET: ${{ secrets.DOC_HOSTING_PROJECT_SECRET }}
          DOC_DOMAIN: ${{ vars.DOC_HOSTING_DOMAIN }}
        run: |
          uv run scripts/publish.py \
            --build-dir docs/_build/dirhtml \
            --root-path "${{ inputs.root_path || 'docs' }}" \
            --language "${{ inputs.language || 'en' }}" \
            --version "${{ inputs.version }}"
