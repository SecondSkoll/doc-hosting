version: 2

build:
  os: ubuntu-24.04
  tools:
    python:
      install:
        - method: uv
          command: sync
          groups:
            - docs
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ Makefile pyproject.toml uv.lock .readthedocs.yaml; then
          exit 183
        fi


sphinx:
  configuration: docs/conf.py
  builder: dirhtml
  fail_on_warning: true
