# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/ for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: doc-hosting-api

type: charm

base: ubuntu@24.04

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: Documentation hosting API layer (ingestion API, version API, doc serving).

# (Required)
description: |
  A 12-factor FastAPI application that implements the doc-hosting API layer:
  an authenticated ingestion API to register documentation builds, a version
  API listing the registered versions and languages, and middleware that
  serves the built documentation straight from an S3-compatible bucket
  (MinIO). The PostgreSQL control plane (via the postgresql integration)
  holds the projects, publications, redirects, migrations and audit history,
  and a staff-only Django admin console is served at /manage/.

extensions:
  - fastapi-framework

config:
  options:
    publish-token:
      type: string
      optional: false
      description: Bearer token required by the ingestion (publish) API; exposed to the application as the APP_PUBLISH_TOKEN environment variable.
    allowed-hosts:
      type: string
      optional: true
      description: Comma-separated list of hosts the /manage/ console may be served from (Django ALLOWED_HOSTS); exposed to the application as the APP_ALLOWED_HOSTS environment variable. When unset, no host is trusted outside development/test mode.
    csrf-trusted-origins:
      type: string
      optional: true
      description: Comma-separated list of trusted origins (e.g. https://docs.example.com) for CSRF validation of the /manage/ console behind an ingress; exposed to the application as the APP_CSRF_TRUSTED_ORIGINS environment variable.

# Integrations used by this application.
# Integrations set to "optional: false" will block the charm
# until the applications are integrated.
requires:
  s3:
    interface: s3
    optional: false
    limit: 1
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1

