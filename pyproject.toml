[project]
name = "doc-hosting-api"
version = "0.1.0"
description = "Documentation hosting API layer with ingestion, version discovery, and S3-backed serving"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "boto3>=1.35",
    "httpx>=0.27",
    "django>=5.1,<6",
    "psycopg[binary]>=3.2",
    "a2wsgi>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "jubilant>=1.2",
    "pytest-jubilant>=0.4",
]
docs = [
    { include-group = "docs-sphinx-stack" },
    "pymarkdownlnt==0.9.35",
    "sphinx>=8,<9",
]
docs-sphinx-stack = [
    "canonical-sphinx~=0.6",
    "myst-parser~=4.0",
    "packaging~=26.1",
    "rst2html",
    "sphinx-autobuild",
    "sphinx-design==0.6.1",
    "sphinx-last-updated-by-git~=0.3",
    "sphinx-llm~=0.4",
    "sphinx-notfound-page~=1.1",
    "sphinx-rerediraffe>=0.0.3,<1.0.0",
    "sphinx-reredirects==0.1.6",
    "sphinx-sitemap~=2.9",
    "sphinx-tabs~=3.5",
    "sphinxcontrib-jquery~=4.1",
    "sphinxcontrib-svg2pdfconverter[cairosvg]~=2.1",
    "sphinxext-opengraph~=0.13",
    "vale==3.13.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: integration tests that require a bootstrapped Juju controller and microk8s (run with '-m integration')",
]
